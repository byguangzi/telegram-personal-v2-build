name: Telegram Personal V2.2 x64 Release
run-name: V2.2 ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Build helper request identifier
        type: string
        required: true
      kit_commit:
        description: Exact uploaded build kit commit
        type: string
        required: true
      dependency_run_id:
        description: Optional previous run containing completed public dependencies
        type: string
        default: ''
      dependency_artifact_id:
        description: Exact public dependency artifact ID from that run
        type: string
        default: ''
      build_mode:
        description: Compiler scheduling only (safe keeps original single process)
        type: choice
        options: [auto, safe]
        default: auto
      dependency_cache:
        description: Revalidated dependency seeds (cold disables cache restore/save)
        type: choice
        options: [verified, cold]
        default: verified
permissions:
  contents: read
  actions: read
concurrency:
  group: telegram-personal-v22
  cancel-in-progress: false
jobs:
  plan:
    if: github.event.repository.private == false && (github.repository_owner == github.actor || github.actor == 'github-actions[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source: ${{ steps.plan.outputs.source }}
      version: ${{ steps.plan.outputs.version }}
      dependency_run: ${{ steps.plan.outputs.dependency_run }}
      dependency_artifact: ${{ steps.plan.outputs.dependency_artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_COMMIT: ${{ inputs.kit_commit }}
          DEPENDENCY_CACHE_MODE: ${{ inputs.dependency_cache || 'verified' }}
          REQUEST_DEPENDENCY_RUN: ${{ inputs.dependency_run_id }}
          REQUEST_DEPENDENCY_ARTIFACT: ${{ inputs.dependency_artifact_id }}
        run: python3 ci/plan_build.py
  dependencies:
    name: Stage 1 - Public dependencies
    if: github.event_name == 'workflow_dispatch' && (github.repository_owner == github.actor || github.actor == 'github-actions[bot]') && github.event.repository.private == false && needs.plan.outputs.dependency_run == '' && needs.plan.outputs.dependency_artifact == ''
    runs-on: windows-2025-vs2026
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh
    needs: plan
    env:
      SOURCE_COMMIT: ${{ needs.plan.outputs.source }}
      SOURCE_VERSION: ${{ needs.plan.outputs.version }}
    outputs:
      drive: ${{ steps.storage.outputs.drive }}
      artifact: ${{ steps.upload-dependencies.outputs.artifact-id }}
    steps:
      - name: Checkout V2.2 build kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify request and prepare build directory
        id: storage
        env:
          REQUEST_COMMIT: ${{ inputs.kit_commit }}
        run: |
          if ($env:REQUEST_COMMIT -ne $env:GITHUB_SHA) { throw 'Build kit commit changed; rerun the helper.' }
          git config --global core.autocrlf false
          git config --global user.name 'Telegram Personal Build'
          git config --global user.email 'build@localhost'
          & "$env:GITHUB_WORKSPACE\ci\storage.ps1" -Mode Prepare
      - name: Checkout exact official Telegram source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: telegramdesktop/tdesktop
          ref: ${{ env.SOURCE_COMMIT }}
          submodules: recursive
          path: TBuild/tdesktop
          persist-credentials: false
      - name: Verify pinned source and apply V2.2 patch
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\verify-kit.ps1" -Cloud -Source "$env:TBUILD\tdesktop" | Out-Null
          $version = Get-Content "$env:TBUILD\tdesktop\Telegram\SourceFiles\core\version.h" -Raw
          if (-not $version.Contains(('AppVersionStr = "' + $env:SOURCE_VERSION + '"'))) { throw 'Version mismatch.' }
          python -m unittest discover -s "$env:GITHUB_WORKSPACE\tests" -p test_*.py
          if ($LASTEXITCODE -ne 0) { throw 'Secret parser regression tests failed.' }
      - name: Prepare official build metadata
        run: |
          $doc = Get-Content "$env:TBUILD\tdesktop\docs\building-win.md" -Raw
          if ($doc -notmatch '\*\*([0-9.]+)\*\* SDK version') { throw 'Cannot determine pinned SDK.' }
          "SDK=$($Matches[1])" >> $env:GITHUB_ENV
          $key = (Get-FileHash "$env:TBUILD\tdesktop\Telegram\build\prepare\prepare.py").Hash
          "CACHE_KEY=$key" >> $env:GITHUB_ENV
      - name: Initialize x64 MSVC 14.44
        uses: Eden-CI/msvc-dev-cmd@1bd71f95d6f3d1b2b3395b335cc63bcdc90cf223
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'
      - name: Ensure matching MSVC 14.44 ATL component
        timeout-minutes: 20
        run: '& "$env:GITHUB_WORKSPACE\ci\ensure-atl.ps1"'
      - name: Refresh x64 compiler environment after ATL setup
        uses: Eden-CI/msvc-dev-cmd@1bd71f95d6f3d1b2b3395b335cc63bcdc90cf223
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'
      - name: Verify ATL before lengthy dependency compilation
        run: '& "$env:GITHUB_WORKSPACE\ci\ensure-atl.ps1" -VerifyOnly'
      - name: Compile and run connection policy regression tests
        run: |
          $include = "$env:TBUILD\tdesktop\Telegram\SourceFiles"
          cl /nologo /std:c++17 /EHsc /W4 /WX /I $include "$env:GITHUB_WORKSPACE\tests\policy_test.cpp" /Fe:"$env:RUNNER_TEMP\policy_test.exe" /Fo:"$env:RUNNER_TEMP\policy_test.obj"
          if ($LASTEXITCODE -ne 0) { throw 'Policy test compilation failed.' }
          & "$env:RUNNER_TEMP\policy_test.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Policy test failed.' }
          cl /nologo /std:c++17 /EHsc /W4 /WX /I $include "$env:GITHUB_WORKSPACE\tests\archive_test.cpp" /Fe:"$env:RUNNER_TEMP\archive_test.exe" /Fo:"$env:RUNNER_TEMP\archive_test.obj"
          if ($LASTEXITCODE -ne 0) { throw 'Archive test compilation failed.' }
          & "$env:RUNNER_TEMP\archive_test.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Archive policy test failed.' }
      - name: Configure NuGet
        shell: cmd
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0
      - name: Compute guarded dependency cache identity
        run: |
          python "$env:GITHUB_WORKSPACE\ci\dependency_cache.py" keys
          if ($LASTEXITCODE -ne 0) { throw 'Dependency cache identity failed.' }
      - name: Restore third party cache
        if: inputs.dependency_cache != 'cold' && env.DEPENDENCY_CACHE_ENABLED == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ env.DEPENDENCY_SEED_PREFIX }}-thirdparty-${{ env.DEPENDENCY_RECIPE_HASH }}
          restore-keys: |
            ${{ env.DEPENDENCY_SEED_PREFIX }}-thirdparty-
      - name: Restore library cache
        if: inputs.dependency_cache != 'cold' && env.DEPENDENCY_CACHE_ENABLED == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ env.DEPENDENCY_SEED_PREFIX }}-libs-${{ env.DEPENDENCY_RECIPE_HASH }}
          restore-keys: |
            ${{ env.DEPENDENCY_SEED_PREFIX }}-libs-
      - name: Restore Qt cache
        if: inputs.dependency_cache != 'cold' && env.DEPENDENCY_CACHE_ENABLED == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ env.DEPENDENCY_SEED_PREFIX }}-qt-${{ env.DEPENDENCY_RECIPE_HASH }}
          restore-keys: |
            ${{ env.DEPENDENCY_SEED_PREFIX }}-qt-
      - name: Record restored dependency stage keys
        run: |
          python "$env:GITHUB_WORKSPACE\ci\dependency_cache.py" before
          if ($LASTEXITCODE -ne 0) { throw 'Dependency cache diagnostics failed.' }
      - name: Prepare official libraries with Release enabled
        shell: cmd
        run: |
          call "%TBUILD%\tdesktop\Telegram\build\prepare\win.bat" silent
          if errorlevel 1 exit /b 1
      - name: Summarize official dependency revalidation
        run: |
          python "$env:GITHUB_WORKSPACE\ci\dependency_cache.py" after
          if ($LASTEXITCODE -ne 0) { throw 'Dependency cache diagnostics failed.' }
      - name: Package public dependencies with integrity manifest
        run: |
          python "$env:GITHUB_WORKSPACE\ci\dependencies.py" pack
          if ($LASTEXITCODE -ne 0) { throw 'Dependency packaging failed.' }
      - name: Save dependencies before Telegram compilation
        id: upload-dependencies
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Public-dependencies-${{ github.run_id }}-${{ github.run_attempt }}
          path: dependency-transfer/
          compression-level: 0
          if-no-files-found: error
          retention-days: 90
      - name: Report dependency disk space
        if: always()
        run: '& "$env:GITHUB_WORKSPACE\ci\storage.ps1" -Mode Report'
  build:
    name: Stage 2 - Windows x64 Release
    if: always() && !cancelled() && github.event_name == 'workflow_dispatch' && (github.repository_owner == github.actor || github.actor == 'github-actions[bot]') && github.event.repository.private == false && (needs.dependencies.result == 'success' || (needs.dependencies.result == 'skipped' && needs.plan.outputs.dependency_run != '' && needs.plan.outputs.dependency_artifact != ''))
    runs-on: windows-2025-vs2026
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh
    needs: [plan, dependencies]
    env:
      SOURCE_COMMIT: ${{ needs.plan.outputs.source }}
      SOURCE_VERSION: ${{ needs.plan.outputs.version }}
      DEPENDENCY_RUN_ID: ${{ needs.plan.outputs.dependency_run || github.run_id }}
      DEPENDENCY_ARTIFACT_ID: ${{ needs.plan.outputs.dependency_artifact || needs.dependencies.outputs.artifact }}
    steps:
      - name: Checkout V2.2 build kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate selected public dependency artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:DEPENDENCY_RUN_ID -notmatch '^\d+$' -or $env:DEPENDENCY_ARTIFACT_ID -notmatch '^\d+$') { throw 'Invalid dependency selection.' }
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $meta = Invoke-RestMethod -Headers $headers -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:DEPENDENCY_ARTIFACT_ID"
          if ($meta.expired -or $meta.workflow_run.id -ne [long]$env:DEPENDENCY_RUN_ID -or $meta.workflow_run.repository_id -ne [long]$env:GITHUB_REPOSITORY_ID) { throw 'Dependency artifact provenance/expiry check failed.' }
          if ($meta.name -notmatch ("^Public-dependencies-" + $env:DEPENDENCY_RUN_ID + "-\d+$")) { throw 'Not a public dependency artifact.' }
      - name: Restore exact public dependency artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ env.DEPENDENCY_ARTIFACT_ID }}
          run-id: ${{ env.DEPENDENCY_RUN_ID }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: dependency-transfer/
      - name: Read original dependency drive and verify download layout
        run: |
          $dir = Join-Path $env:GITHUB_WORKSPACE 'dependency-transfer'
          $manifestPath = Join-Path $dir 'dependencies.json'
          if (-not (Test-Path -LiteralPath $manifestPath) -or -not (Test-Path -LiteralPath (Join-Path $dir 'dependencies.tar.gz'))) { throw 'Dependency download layout mismatch: expected dependencies.json and dependencies.tar.gz directly in dependency-transfer.' }
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.format -ne 1 -or $manifest.identity.SOURCE_COMMIT -ne $env:SOURCE_COMMIT) { throw 'Dependency source/version mismatch.' }
          if ($manifest.identity.BUILD_STORAGE -notmatch '^([A-Z]):\\TelegramPersonalBuildV22$') { throw 'Invalid original dependency build path.' }
          "REQUIRED_BUILD_DRIVE=$($Matches[1])" >> $env:GITHUB_ENV
      - name: Verify request and prepare build directory
        id: storage
        env:
          REQUEST_COMMIT: ${{ inputs.kit_commit }}
        run: |
          if ($env:REQUEST_COMMIT -ne $env:GITHUB_SHA) { throw 'Build kit commit changed; rerun the helper.' }
          git config --global core.autocrlf false
          git config --global user.name 'Telegram Personal Build'
          git config --global user.email 'build@localhost'
          & "$env:GITHUB_WORKSPACE\ci\storage.ps1" -Mode Prepare
      - name: Checkout exact official Telegram source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: telegramdesktop/tdesktop
          ref: ${{ env.SOURCE_COMMIT }}
          submodules: recursive
          path: TBuild/tdesktop
          persist-credentials: false
      - name: Verify pinned source and apply V2.2 patch
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\verify-kit.ps1" -Cloud -Source "$env:TBUILD\tdesktop" | Out-Null
          $version = Get-Content "$env:TBUILD\tdesktop\Telegram\SourceFiles\core\version.h" -Raw
          if (-not $version.Contains(('AppVersionStr = "' + $env:SOURCE_VERSION + '"'))) { throw 'Version mismatch.' }
          python -m unittest discover -s "$env:GITHUB_WORKSPACE\tests" -p test_*.py
          if ($LASTEXITCODE -ne 0) { throw 'Secret parser regression tests failed.' }
      - name: Prepare official build metadata
        run: |
          $doc = Get-Content "$env:TBUILD\tdesktop\docs\building-win.md" -Raw
          if ($doc -notmatch '\*\*([0-9.]+)\*\* SDK version') { throw 'Cannot determine pinned SDK.' }
          "SDK=$($Matches[1])" >> $env:GITHUB_ENV
          $key = (Get-FileHash "$env:TBUILD\tdesktop\Telegram\build\prepare\prepare.py").Hash
          "CACHE_KEY=$key" >> $env:GITHUB_ENV
      - name: Initialize x64 MSVC 14.44
        uses: Eden-CI/msvc-dev-cmd@1bd71f95d6f3d1b2b3395b335cc63bcdc90cf223
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'
      - name: Ensure matching MSVC 14.44 ATL component
        timeout-minutes: 20
        run: '& "$env:GITHUB_WORKSPACE\ci\ensure-atl.ps1"'
      - name: Refresh x64 compiler environment after ATL setup
        uses: Eden-CI/msvc-dev-cmd@1bd71f95d6f3d1b2b3395b335cc63bcdc90cf223
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'
      - name: Verify ATL before lengthy dependency compilation
        run: '& "$env:GITHUB_WORKSPACE\ci\ensure-atl.ps1" -VerifyOnly'
      - name: Compile and run connection policy regression tests
        run: |
          $include = "$env:TBUILD\tdesktop\Telegram\SourceFiles"
          cl /nologo /std:c++17 /EHsc /W4 /WX /I $include "$env:GITHUB_WORKSPACE\tests\policy_test.cpp" /Fe:"$env:RUNNER_TEMP\policy_test.exe" /Fo:"$env:RUNNER_TEMP\policy_test.obj"
          if ($LASTEXITCODE -ne 0) { throw 'Policy test compilation failed.' }
          & "$env:RUNNER_TEMP\policy_test.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Policy test failed.' }
          cl /nologo /std:c++17 /EHsc /W4 /WX /I $include "$env:GITHUB_WORKSPACE\tests\archive_test.cpp" /Fe:"$env:RUNNER_TEMP\archive_test.exe" /Fo:"$env:RUNNER_TEMP\archive_test.obj"
          if ($LASTEXITCODE -ne 0) { throw 'Archive test compilation failed.' }
          & "$env:RUNNER_TEMP\archive_test.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Archive policy test failed.' }
      - name: Configure NuGet
        shell: cmd
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0
      - name: Validate and unpack dependency handoff
        run: |
          python "$env:GITHUB_WORKSPACE\ci\dependencies.py" unpack
          if ($LASTEXITCODE -ne 0) { throw 'Dependency restore failed; no fallback to recompiling dependencies.' }
      - name: Compress build intermediates and verify remaining disk space
        run: '& "$env:GITHUB_WORKSPACE\ci\storage.ps1" -Mode BeforeCompile'
      - name: Generate private runtime configuration
        env:
          PRECONFIGURED_PROXY_HOST: ${{ secrets.PRECONFIGURED_PROXY_HOST }}
          PRECONFIGURED_PROXY_PORT: ${{ secrets.PRECONFIGURED_PROXY_PORT }}
          PRECONFIGURED_PROXY_SECRET: ${{ secrets.PRECONFIGURED_PROXY_SECRET }}
        run: |
          python "$env:GITHUB_WORKSPACE\ci\generate_proxy.py" --output "$env:TBUILD\tdesktop\Telegram\SourceFiles\core\preconfigured_proxy_config.h"
          if ($LASTEXITCODE -ne 0) { throw 'Private configuration validation failed.' }
      - name: Configure and compile Release with redacted output
        env:
          BUILD_MODE: ${{ inputs.build_mode || 'auto' }}
          TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID }}
          TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
          PRECONFIGURED_PROXY_HOST: ${{ secrets.PRECONFIGURED_PROXY_HOST }}
          PRECONFIGURED_PROXY_PORT: ${{ secrets.PRECONFIGURED_PROXY_PORT }}
          PRECONFIGURED_PROXY_SECRET: ${{ secrets.PRECONFIGURED_PROXY_SECRET }}
        run: |
          python "$env:GITHUB_WORKSPACE\ci\build.py"
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed; actual redacted logs are above.' }
      - name: Report disk space even after failure
        if: always()
        run: '& "$env:GITHUB_WORKSPACE\ci\storage.ps1" -Mode Report'
      - name: Verify binary architecture, dependencies, size and SHA-256
        run: |
          python "$env:GITHUB_WORKSPACE\ci\stage.py"
          if ($LASTEXITCODE -ne 0) { throw 'Release artifact verification failed.' }
      - name: Upload verified V2.2 artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Telegram-Personal-v2.2
          path: artifact/
          if-no-files-found: error
          retention-days: 90
  candidate:
    name: Save candidate release for runtime acceptance
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Telegram-Personal-v2.2
          path: artifact/
      - name: Publish draft only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/publish_candidate.py
